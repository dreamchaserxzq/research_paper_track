name: W45 one-time deterministic registry build

on:
  push:
    paths:
      - .github/workflows/w45-registry-build-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w45-one-time-registry-build
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'dreamchaserxzq/research_paper_track'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install 'Markdown>=3.4,<4'
      - name: Validate W45 run and source events
        run: python scripts/papertrack.py validate-run metadata/runs/published-2026-W45.json
      - name: Generate deterministic unified registry and compatible views
        run: python scripts/papertrack.py build
      - name: Validate generated registry, provenance, hashes and links
        run: python scripts/papertrack.py check
      - name: Run all repository regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify changed files are exclusively generated views
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
            metadata/papers.jsonl
            metadata/paper_registry.jsonl
            metadata/published_papers.jsonl
            metadata/source_records.jsonl
            metadata/conflicts.jsonl
            metadata/run_index.jsonl
            metadata/build_summary.json
            seen_papers.txt
            docs/DIGEST_INDEX.md
            docs/PAPER_CATALOG.md
            docs/RESEARCH_COMPARISON.md
            docs/reports/DATA_QUALITY.md
            README.md
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          unexpected = changed - allowed
          if unexpected or untracked:
              raise SystemExit(f'Unexpected changes: {sorted(unexpected)}; untracked {untracked}')
          must = {'metadata/papers.jsonl','metadata/published_papers.jsonl',
                  'metadata/paper_registry.jsonl','README.md'}
          if not must <= changed:
              raise SystemExit(f'Not all W45 registry views changed: {sorted(must-changed)}')
          print('Validated generated-only scope:', sorted(changed))
          PY
          git diff --check
      - name: Commit generated files and verify upstream main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo 'main advanced since checkout, abort to avoid overwriting any work'; exit 1;
          }
          git add -- \
            metadata/papers.jsonl \
            metadata/paper_registry.jsonl \
            metadata/published_papers.jsonl \
            metadata/source_records.jsonl \
            metadata/conflicts.jsonl \
            metadata/run_index.jsonl \
            metadata/build_summary.json \
            seen_papers.txt \
            docs/DIGEST_INDEX.md \
            docs/PAPER_CATALOG.md \
            docs/RESEARCH_COMPARISON.md \
            docs/reports/DATA_QUALITY.md \
            README.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No generated changes required'; exit 0; }
          git config user.name 'PDE Papertrack Automation'
          git config user.email 'papertrack-actions@users.noreply.github.com'
          git commit -m 'Build W45 AI for PDE formal publication registry views'
          git push origin HEAD:refs/heads/main
          git fetch origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          git diff --exit-code HEAD FETCH_HEAD -- \
            metadata/papers.jsonl metadata/published_papers.jsonl \
            metadata/paper_registry.jsonl README.md docs/DIGEST_INDEX.md
          echo "Verified W45 generated views on remote main at $(git rev-parse HEAD)"

name: Metadata history merge W31-W35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metadata-history-merge-w31-w35.yml'

permissions:
  contents: write

jobs:
  merge:
    if: github.event.head_commit.message == 'run metadata history merge W31-W35'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge published metadata history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          import unicodedata
          from pathlib import Path

          ROOT = Path('.')
          META = ROOT / 'metadata'
          WEEKS = [31, 32, 33, 34, 35]
          MAINT_DATE = '2026-08-24'
          MAINT_TS = '2026-08-24T08:02:00Z'

          ALLOWED_CATEGORIES = {'foundation_model','operator','surrogate','data','pinn','enabling'}
          ALLOWED_TIERS = {'core','extended','pending'}
          FORMAL = {'published','accepted','online first','online-first','early access','early-access','in press','in-press'}
          WEAK = {'', 'arxiv', 'preprint', 'submitted', 'unknown', 'pending-formal-verification', None}
          REQUIRED_V2 = [
              'title','authors','venue','publisher','publication_date','doi','official_url','abstract','keywords',
              'sources','status','selection_tier','published_category','foundation_model_level','score_relevance',
              'score_generality','score_value','score_total','registry_schema_version'
          ]
          CRITICAL = {'doi','venue','publisher','publication_date','official_url'}

          def load_jsonl_raw(path: Path):
              raw = path.read_text(encoding='utf-8').splitlines()
              objs = []
              clean_raw = []
              for n, line in enumerate(raw, 1):
                  if not line.strip():
                      continue
                  try:
                      objs.append(json.loads(line))
                  except Exception as e:
                      raise RuntimeError(f'{path}:{n}: invalid JSON: {e}')
                  clean_raw.append(line)
              return clean_raw, objs

          def write_jsonl_preserving(path: Path, raw_lines, objs, modified, appended_start):
              out = []
              for i, obj in enumerate(objs):
                  if i < appended_start and i not in modified:
                      out.append(raw_lines[i])
                  else:
                      out.append(json.dumps(obj, ensure_ascii=False, separators=(',', ':')))
              path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          def missing(v):
              if v is None:
                  return True
              if isinstance(v, str):
                  return v.strip().lower() in {'', 'unknown', 'preprint', 'submitted', 'arxiv', 'null', 'none'}
              return False

          def norm_text(s):
              if not s:
                  return ''
              s = unicodedata.normalize('NFKC', str(s)).lower()
              return ''.join(ch for ch in s if ch.isalnum())

          def norm_doi(s):
              if not s:
                  return ''
              s = str(s).strip().lower()
              for p in ('https://doi.org/','http://doi.org/','doi:'):
                  if s.startswith(p):
                      s = s[len(p):]
              return s.strip()

          def first_author(o):
              if o.get('first_author'):
                  return norm_text(o['first_author'])
              a = o.get('authors') or []
              return norm_text(a[0] if a else '')

          def same_identity(a, b):
              da, db = norm_doi(a.get('doi')), norm_doi(b.get('doi'))
              if da and db and da == db:
                  return True
              aa, ab = str(a.get('arxiv_id') or '').strip(), str(b.get('arxiv_id') or '').strip()
              if aa and ab and aa == ab:
                  return True
              for k in ('openalex_id','semantic_scholar_id'):
                  va, vb = str(a.get(k) or '').strip(), str(b.get(k) or '').strip()
                  if va and vb and va == vb:
                      return True
              ta, tb = norm_text(a.get('title')), norm_text(b.get('title'))
              if ta and tb and ta == tb:
                  return True
              if ta and tb and ta == tb and first_author(a) == first_author(b):
                  return True
              if ta and tb and ta == tb and first_author(a) == first_author(b) and norm_text(a.get('venue')) == norm_text(b.get('venue')):
                  return True
              return False

          conflicts = []

          def merge_missing_only(old, new, scope, identity):
              changed = False
              for k, v in new.items():
                  if v is None:
                      continue
                  if k in {'source','sources','status_evidence'}:
                      if isinstance(v, list):
                          oldv = old.get(k)
                          if oldv is None:
                              old[k] = list(v); changed = True
                          elif isinstance(oldv, list):
                              merged = oldv + [x for x in v if x not in oldv]
                              if merged != oldv:
                                  old[k] = merged; changed = True
                      continue
                  if k == 'status':
                      ov = str(old.get(k) or '').strip().lower() or None
                      nv = str(v).strip().lower()
                      if ov in WEAK and nv in FORMAL:
                          old[k] = v; changed = True
                      continue
                  if k == 'registry_schema_version' and not missing(old.get(k)):
                      continue
                  if missing(old.get(k)):
                      old[k] = v; changed = True
                  elif k in CRITICAL:
                      ov = norm_doi(old[k]) if k == 'doi' else norm_text(old[k])
                      nv = norm_doi(v) if k == 'doi' else norm_text(v)
                      if ov and nv and ov != nv:
                          conflicts.append({'scope':scope,'identity':identity,'field':k,'existing':old[k],'incoming':v})
              return changed

          # ---- published_papers.jsonl ----
          pub_path = META / 'published_papers.jsonl'
          pub_raw, pub = load_jsonl_raw(pub_path)
          pub_orig_len = len(pub)
          pub_modified = set()
          source_records = []
          for w in WEEKS:
              p = META / f'published_papers_2026_W{w:02d}.jsonl'
              if p.exists():
                  _, recs = load_jsonl_raw(p)
                  source_records.extend((w, r) for r in recs)

          new_pub = 0
          duplicate_pub = 0
          for w, cand in source_records:
              if cand.get('registry_schema_version') == 'published-v2':
                  if 'sources' not in cand and 'source' in cand:
                      cand['sources'] = cand['source']
                  for k in REQUIRED_V2:
                      cand.setdefault(k, None)
                  if cand.get('selection_tier') not in ALLOWED_TIERS:
                      raise RuntimeError(f'W{w}: invalid selection_tier for {cand.get("title")}')
                  if cand.get('published_category') not in ALLOWED_CATEGORIES:
                      raise RuntimeError(f'W{w}: invalid published_category for {cand.get("title")}')
                  scores = [cand.get('score_relevance'), cand.get('score_generality'), cand.get('score_value')]
                  if not all(isinstance(x, (int,float)) for x in scores) or sum(scores) != cand.get('score_total'):
                      raise RuntimeError(f'W{w}: invalid scores for {cand.get("title")}')
              match = next((i for i, old in enumerate(pub) if same_identity(old, cand)), None)
              if match is None:
                  pub.append(cand)
                  new_pub += 1
              else:
                  duplicate_pub += 1
                  ident = cand.get('doi') or cand.get('arxiv_id') or cand.get('title')
                  if merge_missing_only(pub[match], cand, 'published_papers', ident):
                      pub_modified.add(match)

          # validate newly merged published-v2 records and new duplicates
          seen_doi, seen_arxiv, seen_title = {}, {}, {}
          for i, o in enumerate(pub):
              if o.get('registry_schema_version') == 'published-v2':
                  for k in REQUIRED_V2:
                      if k not in o:
                          raise RuntimeError(f'missing published-v2 key {k} at record {i}')
                  if o.get('selection_tier') not in ALLOWED_TIERS:
                      raise RuntimeError(f'invalid tier at record {i}')
                  if o.get('published_category') not in ALLOWED_CATEGORIES:
                      raise RuntimeError(f'invalid category at record {i}')
              d = norm_doi(o.get('doi'))
              a = str(o.get('arxiv_id') or '').strip()
              t = (norm_text(o.get('title')), first_author(o), norm_text(o.get('venue')))
              for key, val, seen in [('doi',d,seen_doi),('arxiv',a,seen_arxiv),('title-author-venue',t,seen_title)]:
                  if not val or val == ('','',''):
                      continue
                  if val in seen and (i >= pub_orig_len or seen[val] >= pub_orig_len):
                      raise RuntimeError(f'new duplicate {key}: {val}')
                  seen[val] = i

          write_jsonl_preserving(pub_path, pub_raw, pub, pub_modified, pub_orig_len)

          # ---- paper_registry.jsonl ----
          reg_path = META / 'paper_registry.jsonl'
          reg_raw, reg = load_jsonl_raw(reg_path)
          reg_orig_len = len(reg)
          reg_modified = set()

          synthesized = []
          for w, o in source_records:
              if not o.get('arxiv_id'):
                  continue
              synthesized.append({
                  'arxiv_id': o.get('arxiv_id'), 'title': o.get('title'), 'authors': o.get('authors'),
                  'doi': o.get('doi'), 'venue': o.get('venue'), 'publisher': o.get('publisher'),
                  'publication_type': o.get('publication_type'), 'publication_date': o.get('publication_date'),
                  'journal_volume': o.get('journal_volume'), 'journal_issue': o.get('journal_issue'),
                  'page_or_article_number': o.get('page_or_article_number'), 'official_url': o.get('official_url'),
                  'status': o.get('status'), 'status_confidence': 1.0,
                  'status_evidence': o.get('sources') or o.get('source') or [],
                  'last_status_check': MAINT_DATE,
                  '_synthetic': True,
              })

          explicit = []
          for w in WEEKS:
              p = META / f'paper_registry_updates_2026_W{w:02d}.jsonl'
              if p.exists():
                  _, recs = load_jsonl_raw(p)
                  explicit.extend(recs)

          reg_updates = 0
          reg_appended = 0
          for patch in synthesized + explicit:
              status = patch.get('status') or patch.get('new_status')
              p = dict(patch)
              p.pop('_synthetic', None)
              p.pop('old_status', None)
              p.pop('new_status', None)
              if status:
                  p['status'] = status
              aid = str(p.get('arxiv_id') or '').strip()
              doi = norm_doi(p.get('doi'))
              title = norm_text(p.get('title'))
              match = None
              if aid:
                  match = next((i for i,o in enumerate(reg) if str(o.get('arxiv_id') or '').strip() == aid), None)
              if match is None and doi:
                  match = next((i for i,o in enumerate(reg) if norm_doi(o.get('doi')) == doi and doi), None)
              if match is None and title:
                  matches = [i for i,o in enumerate(reg) if norm_text(o.get('title')) == title]
                  if len(matches) == 1:
                      match = matches[0]
              if match is None:
                  # Explicit patches are authoritative enough to retain even if the bootstrap registry missed the record.
                  if patch in explicit:
                      p.setdefault('last_status_check', MAINT_DATE)
                      reg.append(p)
                      reg_appended += 1
                  continue

              old = reg[match]
              changed = False
              ident = aid or p.get('doi') or p.get('title')
              # Evidence lists are unioned; trusted formal fields are never overwritten on conflict.
              for list_key in ('status_evidence','source','sources'):
                  v = p.get(list_key)
                  if isinstance(v, list):
                      ov = old.get(list_key)
                      if ov is None:
                          old[list_key] = list(v); changed = True
                      elif isinstance(ov, list):
                          nv = ov + [x for x in v if x not in ov]
                          if nv != ov:
                              old[list_key] = nv; changed = True
              for k in ('title','authors','first_author','institutions','abstract','doi','venue','publisher','publication_type',
                        'publication_date','journal_ref','official_url','openalex_id','semantic_scholar_id','crossref_url',
                        'journal_volume','journal_issue','page_or_article_number'):
                  v = p.get(k)
                  if v is None:
                      continue
                  if missing(old.get(k)):
                      old[k] = v; changed = True
                  elif k in CRITICAL:
                      ov = norm_doi(old[k]) if k == 'doi' else norm_text(old[k])
                      nv = norm_doi(v) if k == 'doi' else norm_text(v)
                      if ov and nv and ov != nv:
                          conflicts.append({'scope':'paper_registry','identity':ident,'field':k,'existing':old[k],'incoming':v})
              nv_status = str(p.get('status') or '').strip().lower()
              ov_status = str(old.get('status') or '').strip().lower() or None
              if nv_status in FORMAL and ov_status in WEAK:
                  old['status'] = p['status']; changed = True
              conf = p.get('status_confidence')
              if isinstance(conf,(int,float)) and (not isinstance(old.get('status_confidence'),(int,float)) or conf > old.get('status_confidence')):
                  old['status_confidence'] = conf; changed = True
              check = p.get('last_status_check') or (str(p.get('updated_at'))[:10] if p.get('updated_at') else None)
              if check and (not old.get('last_status_check') or str(check) > str(old.get('last_status_check'))):
                  old['last_status_check'] = check; changed = True
              if p.get('updated_at') and missing(old.get('updated_at')):
                  old['updated_at'] = p['updated_at']; changed = True
              if changed:
                  reg_modified.add(match)
                  reg_updates += 1

          write_jsonl_preserving(reg_path, reg_raw, reg, reg_modified, reg_orig_len)

          # ---- README: only PUBLISHED_DIGEST marker block ----
          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          start = '<!-- PUBLISHED_DIGEST_START -->'
          end = '<!-- PUBLISHED_DIGEST_END -->'
          if readme.count(start) != 1 or readme.count(end) != 1:
              raise RuntimeError('README PUBLISHED_DIGEST markers are missing or duplicated')
          before, rest = readme.split(start, 1)
          body, after = rest.split(end, 1)
          chunks = [c.strip() for c in re.split(r'(?=^### 20\d\d-W\d\d)', body, flags=re.M) if c.strip().startswith('### ')]
          by_week = {}
          for c in chunks:
              m = re.match(r'### (20\d\d-W\d\d)', c)
              if m:
                  by_week[m.group(1)] = c

          new_blocks = {
          '2026-W31': '''### 2026-W31 · 历史补档

- [📄 AI for PDE 正式发表论文追踪周报](digests/published/AI-for-PDE-正式发表周报-2026-W31.md)
- **统计**：原始候选 18 篇；去重后 10 篇；正式状态明确 6 篇；核心入选 2 篇；扩展入选 1 篇；状态更新 0 篇；待确认 2 篇。
- **重点论文**：未知流形 Physics-Informed DeepONet、SV-PINO、GAPI-DeepONet。
- **主要趋势**：几何/流形未知条件下的算子学习、分离变量 physics-informed operator 与任意几何条件化成为补档重点。''',
          '2026-W32': '''### 2026-W32 · 2026-08-03

- [📄 AI for PDE 正式发表论文追踪周报](digests/published/AI-for-PDE-正式发表周报-2026-W32.md)
- **统计**：原始候选 23 篇；去重后 20 篇；正式状态明确 9 篇；核心入选 1 篇；扩展入选 2 篇；状态更新 0 篇；待确认 1 篇。
- **重点论文**：PGMNO、Hermite Neural Operator、MPNOT。
- **主要趋势**：Mamba/SSM、无界域谱基和局部动力学先验继续扩展神经算子结构空间。''',
          '2026-W33': '''### 2026-W33 · 2026-08-12

- [📄 AI for PDE 正式发表论文追踪周报](digests/published/AI-for-PDE-正式发表周报-2026-W33.md)
- **统计**：原始候选 25 篇；去重后 22 篇；正式状态明确 15 篇；核心入选 9 篇；扩展入选 1 篇；状态更新 7 篇；待确认 0 篇。
- **重点论文**：HyPINO、P3D、RealPDEBench、PGD-NO、Hyperbolic Neural Operator、ENMA、SC-NO。
- **主要趋势**：多 PDE 零样本、真实数据 benchmark、生成式 PDE 求解和千万节点 3D 几何扩展成为正式发表主线。''',
          '2026-W34': '''### 2026-W34 · 2026-08-17

- [📄 AI for PDE 正式发表论文追踪周报](digests/published/AI-for-PDE-正式发表周报-2026-W34.md)
- **统计**：原始候选 24 篇；去重后 15 篇；正式状态明确 8 篇；核心入选 6 篇；扩展入选 0 篇；状态更新 0 篇；待确认 2 篇。
- **重点论文**：MoE-POT、GAOT、Riesz Neural Operator、NOWS、PFEM、DeltaPhi。
- **主要趋势**：稀疏 MoE PDE 预训练、复杂几何算子以及 neural-operator + classical-solver warm start 三条路线明显增强。''',
          '2026-W35': '''### 2026-W35 · 2026-08-24

- [📄 AI for PDE 正式发表论文追踪周报](digests/published/AI-for-PDE-正式发表周报-2026-W35.md)
- **统计**：原始候选 21 篇；去重后 12 篇；正式状态明确 5 篇；核心入选 4 篇；扩展入选 1 篇；状态更新 2 篇；待确认 0 篇。
- **重点论文**：CFO、Adaptive Mamba Neural Operators、DRIFT-Net、Physics-Informed Laplace Neural Operator。
- **主要趋势**：连续时间 flow matching、SSM 任意几何算子和显式全局谱耦合成为本期最值得关注的结构方向。'''
          }
          by_week.update(new_blocks)
          weeks_sorted = sorted(by_week)[-12:]
          new_body = '\n\n' + '\n\n'.join(by_week[w] for w in weeks_sorted) + '\n\n'
          readme_new = before + start + new_body + end + after
          # Assert marker-external text is unchanged.
          if not readme_new.startswith(before + start) or not readme_new.endswith(end + after):
              raise RuntimeError('README marker-external content changed unexpectedly')
          readme_path.write_text(readme_new, encoding='utf-8')

          # ---- maintenance run log ----
          log_path = ROOT / 'run_log_published.md'
          log = log_path.read_text(encoding='utf-8')
          if '元数据历史归并 W31-W35' not in log:
              nums = [int(x) for x in re.findall(r'^\|\s*(\d+)\s*\|', log, flags=re.M)]
              run_no = (max(nums) + 1) if nums else 1
              row = (
                  f'| {run_no} | {MAINT_TS} | 元数据历史归并 W31-W35 | {len(source_records)} | '
                  f'{len(source_records)-duplicate_pub} | {len(source_records)} | {new_pub} | {reg_updates + reg_appended} | '
                  f'{len(conflicts)} | 历史归并维护：W31-W35 分周正式元数据已去重归并到权威 published_papers.jsonl；'
                  f'paper_registry 根据分周正式记录与 registry patches 仅补全缺失/弱状态字段；README PUBLISHED_DIGEST 区补齐 W31-W35。'
                  f'保留分周增量文件作审计；关键正式元数据冲突 {len(conflicts)} 项，未自动覆盖。 |\n'
              )
              if not log.endswith('\n'):
                  log += '\n'
              log += row
              log_path.write_text(log, encoding='utf-8')

          conflict_path = META / 'metadata_merge_conflicts_2026_W31_W35.jsonl'
          if conflicts:
              conflict_path.write_text('\n'.join(json.dumps(x, ensure_ascii=False, separators=(',',':')) for x in conflicts) + '\n', encoding='utf-8')
          elif conflict_path.exists():
              conflict_path.unlink()

          # Final syntax validation.
          for p in (pub_path, reg_path):
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip():
                      json.loads(line)
          rd = readme_path.read_text(encoding='utf-8')
          assert rd.count(start) == 1 and rd.count(end) == 1
          for w in ('2026-W31','2026-W32','2026-W33','2026-W34','2026-W35'):
              assert rd.count(f'### {w}') == 1

          print(json.dumps({
              'published_source_records': len(source_records),
              'published_appended': new_pub,
              'published_duplicates_seen': duplicate_pub,
              'published_existing_lines_modified': len(pub_modified),
              'registry_records_updated': reg_updates,
              'registry_records_appended': reg_appended,
              'conflicts': len(conflicts),
              'published_total': len(pub),
              'registry_total': len(reg),
              'readme_weeks': weeks_sorted,
          }, ensure_ascii=False, indent=2))
          PY

          git config user.name 'ArXiv Tracker Bot'
          git config user.email 'arxiv-tracker@automated.bot'
          git rm .github/workflows/metadata-history-merge-w31-w35.yml
          git add metadata/published_papers.jsonl metadata/paper_registry.jsonl README.md run_log_published.md
          if [[ -f metadata/metadata_merge_conflicts_2026_W31_W35.jsonl ]]; then
            git add metadata/metadata_merge_conflicts_2026_W31_W35.jsonl
          fi
          git status --short
          git diff --check
          git commit -m 'merge published metadata history W31-W35'
          git push origin HEAD:main

name: W48 one-time deterministic registry build
on:
  push:
    paths:
      - .github/workflows/w48-build-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w48-build-once
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'dreamchaserxzq/research_paper_track'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install 'Markdown>=3.4,<4'
      - name: Validate structured W48 evidence
        run: python scripts/papertrack.py validate-run metadata/runs/published-2026-W48.json
      - name: Generate canonical and compatibility views
        run: python scripts/papertrack.py build
      - name: Full repository data check
        run: python scripts/papertrack.py check
      - name: Repository regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate exact generated-file scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'metadata/papers.jsonl',
              'metadata/paper_registry.jsonl',
              'metadata/published_papers.jsonl',
              'metadata/source_records.jsonl',
              'metadata/conflicts.jsonl',
              'metadata/run_index.jsonl',
              'metadata/build_summary.json',
              'seen_papers.txt',
              'docs/DIGEST_INDEX.md',
              'docs/PAPER_CATALOG.md',
              'docs/RESEARCH_COMPARISON.md',
              'docs/reports/DATA_QUALITY.md',
              'README.md'
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed - allowed or untracked:
              raise SystemExit('Unexpected edits: '+repr(sorted(changed-allowed))+repr(sorted(untracked)))
          expected = {'metadata/papers.jsonl','metadata/paper_registry.jsonl','metadata/published_papers.jsonl','README.md'}
          if not expected <= changed:
              raise SystemExit('Missing critical generated view(s): '+repr(sorted(expected-changed)))
          print('Checked generated diff:', *sorted(changed), sep='\n - ')
          PY
          git diff --check
      - name: Commit only generated views to current main and verify remote
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "main advanced since workflow checkout; abort instead of overwriting"; exit 1;
          }
          git add -- \
            metadata/papers.jsonl \
            metadata/paper_registry.jsonl \
            metadata/published_papers.jsonl \
            metadata/source_records.jsonl \
            metadata/conflicts.jsonl \
            metadata/run_index.jsonl \
            metadata/build_summary.json \
            seen_papers.txt \
            docs/DIGEST_INDEX.md \
            docs/PAPER_CATALOG.md \
            docs/RESEARCH_COMPARISON.md \
            docs/reports/DATA_QUALITY.md \
            README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes required"
            exit 0
          fi
          git config user.name "PDE Papertrack Automation"
          git config user.email "papertrack-actions@users.noreply.github.com"
          git commit -m "Rebuild AI for PDE W48 published registry views"
          git push origin HEAD:refs/heads/main
          git fetch origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          git diff --exit-code HEAD FETCH_HEAD -- \
            metadata/papers.jsonl metadata/paper_registry.jsonl \
            metadata/published_papers.jsonl README.md docs/DIGEST_INDEX.md
          echo "Verified W48 generated views on main at $(git rev-parse HEAD)"
